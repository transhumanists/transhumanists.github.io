<div class="ul-player" id="ul-player" aria-label="Cyber-Ambient Audio Stream">
  <button class="ul-player-toggle" id="ul-player-toggle" aria-label="Toggle audio player HUD" title="Audio HUD">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span class="ul-player-status-dot" id="ul-status-dot"></span>
  </button>
  <div class="ul-player-body" id="ul-player-body">
    <div class="ul-player-info">
      <span class="ul-player-label">AUDIO STREAM</span>
      <span class="ul-player-title" id="ul-track-title">Cyber-Ambient Synth #1</span>
    </div>
    <div class="ul-player-visualizer" id="ul-visualizer" aria-hidden="true">
      <canvas id="ul-canvas" width="64" height="24"></canvas>
    </div>
    <div class="ul-player-controls">
      <button id="ul-prev" aria-label="Previous track" title="Previous">⏮</button>
      <button id="ul-play" class="ul-play-btn" aria-label="Play or Pause music" title="Play / Pause">▶</button>
      <button id="ul-next" aria-label="Next track" title="Next">⏭</button>
      <input type="range" id="ul-vol" min="0" max="1" step="0.05" value="0.5" aria-label="Volume" title="Volume">
    </div>
  </div>
</div>
<style>
.ul-player {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(10, 14, 18, 0.92);
  border: 1px solid rgba(0, 229, 255, 0.3);
  border-radius: 999px;
  padding: 8px 18px 8px 8px;
  backdrop-filter: blur(16px);
  box-shadow:
    0 12px 40px rgba(0,0,0,0.6),
    0 0 20px rgba(0,229,255,0.1),
    inset 0 1px 0 rgba(255,255,255,0.03);
  font-family: var(--font-mono, monospace);
  color: #e8eef2;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.ul-player:hover {
  border-color: rgba(0, 229, 255, 0.5);
  box-shadow:
    0 16px 48px rgba(0,0,0,0.7),
    0 0 30px rgba(0,229,255,0.15),
    inset 0 1px 0 rgba(255,255,255,0.05);
}
.ul-player-toggle {
  background: linear-gradient(135deg, rgba(0,229,255,0.18), rgba(124,77,255,0.18));
  border: 1px solid rgba(0,229,255,0.35);
  color: #00e5ff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background 0.25s, box-shadow 0.25s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.ul-player-toggle:hover {
  transform: scale(1.12);
  background: linear-gradient(135deg, #00e5ff, #7c4dff);
  color: #fff;
  box-shadow: 0 0 24px rgba(0,229,255,0.4);
}
.ul-player-toggle:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(255, 0, 102, 0.5);
}
.ul-player-status-dot {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #556677;
  box-shadow: 0 0 6px rgba(0,0,0,0.6);
  transition: all 0.2s;
}
.ul-player-status-dot.playing {
  background: #00cc88;
  box-shadow:
    0 0 10px #00cc88,
    0 0 20px rgba(0,204,136,0.4);
  animation: pulse-dot 1.8s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(1.15); }
}
.ul-player-body {
  display: flex;
  align-items: center;
  gap: 14px;
  overflow: hidden;
  max-width: 320px;
  transition: max-width 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s;
}
.ul-player.collapsed .ul-player-body {
  max-width: 0;
  opacity: 0;
  pointer-events: none;
  margin: 0;
  padding: 0;
}
.ul-player-info {
  display: flex;
  flex-direction: column;
  min-width: 130px;
}
.ul-player-label {
  font-size: 7.5px;
  letter-spacing: 0.1em;
  color: #556677;
  text-transform: uppercase;
  font-weight: 600;
}
.ul-player-title {
  font-size: 12px;
  font-weight: 600;
  color: #00e5ff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
  text-shadow: 0 0 10px rgba(0,229,255,0.3);
}
.ul-player-visualizer {
  width: 64px;
  height: 24px;
  border-radius: 4px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(0,229,255,0.15);
  overflow: hidden;
  flex-shrink: 0;
}
.ul-player-visualizer canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.ul-player-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.ul-player-controls button {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #e8eef2;
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.ul-player-controls button:hover {
  background: rgba(0,229,255,0.18);
  border-color: rgba(0,229,255,0.5);
  color: #00e5ff;
  transform: translateY(-1px);
}
.ul-player-controls button:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(255, 0, 102, 0.5);
}
.ul-play-btn {
  background: rgba(0,229,255,0.22) !important;
  border-color: rgba(0,229,255,0.55) !important;
  color: #00e5ff !important;
  font-weight: 700;
  box-shadow: 0 0 12px rgba(0,229,255,0.2);
}
.ul-play-btn:hover {
  background: rgba(0,229,255,0.35) !important;
  box-shadow: 0 0 20px rgba(0,229,255,0.35);
}
.ul-player-controls input[type="range"] {
  width: 60px;
  accent-color: #00e5ff;
  cursor: pointer;
  height: 4px;
}
.ul-player-controls input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #00e5ff;
  box-shadow: 0 0 8px rgba(0,229,255,0.5);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.ul-player-controls input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
  box-shadow: 0 0 14px rgba(0,229,255,0.7);
}
@media (max-width: 640px) {
  .ul-player { top: 10px; left: 10px; padding: 6px 14px 6px 6px; gap: 8px; }
  .ul-player-body { max-width: 260px; }
  .ul-player-controls input[type="range"] { width: 48px; }
  .ul-player-visualizer { width: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .ul-player, .ul-player-toggle, .ul-player-status-dot,
  .ul-player-controls button, .ul-player-body {
    transition: none !important;
    animation: none !important;
  }
}
</style>
<script>
(function() {
  const toggle = document.getElementById('ul-player-toggle');
  const player = document.getElementById('ul-player');
  const playBtn = document.getElementById('ul-play');
  const prevBtn = document.getElementById('ul-prev');
  const nextBtn = document.getElementById('ul-next');
  const volInput = document.getElementById('ul-vol');
  const statusDot = document.getElementById('ul-status-dot');
  const trackTitle = document.getElementById('ul-track-title');
  const canvas = document.getElementById('ul-canvas');

  if (!toggle || !playBtn || !canvas) return;

  const ctx = canvas.getContext('2d');
  
  // Persistent state across ecosystem domains via localStorage
  const STORAGE_PREFIX = 'neohiro_ecosystem_audio_';
  let isCollapsed = localStorage.getItem(STORAGE_PREFIX + 'collapsed') === 'true';
  let currentTrack = parseInt(localStorage.getItem(STORAGE_PREFIX + 'track') || '0', 10);
  let savedVol = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'vol') ?? '0.5');
  let autoPlay = localStorage.getItem(STORAGE_PREFIX + 'playing') === 'true';

  volInput.value = savedVol;
  if (isCollapsed) {
    player.classList.add('collapsed');
  }

  toggle.addEventListener('click', () => {
    isCollapsed = !isCollapsed;
    player.classList.toggle('collapsed', isCollapsed);
    try { localStorage.setItem(STORAGE_PREFIX + 'collapsed', isCollapsed); } catch(e){}
  });

  const tracks = [
    { name: "Cyber-Ambient Synth #1", baseFreq: 146.83, type: 'sawtooth', detune: 0, lfoRate: 0.15, lfoDepth: 12 },
    { name: "Neon Grid Runner #2", baseFreq: 164.81, type: 'square', detune: -8, lfoRate: 0.3, lfoDepth: 8 },
    { name: "Sub-Zero Protocol #3", baseFreq: 110.00, type: 'triangle', detune: 4, lfoRate: 0.08, lfoDepth: 18 }
  ];
  
  currentTrack = ((currentTrack % tracks.length) + tracks.length) % tracks.length;
  trackTitle.textContent = tracks[currentTrack].name;

  let audioCtx = null;
  let masterGain = null;
  let analyser = null;
  let osc1 = null, osc2 = null, subOsc = null;
  let lfo1 = null, lfo2 = null;
  let filter = null, filterLFO = null;
  let isPlaying = false;
  let animationId = null;

  function updateTrack() {
    trackTitle.textContent = tracks[currentTrack].name;
    try { localStorage.setItem(STORAGE_PREFIX + 'track', currentTrack); } catch(e){}
    if (isPlaying && audioCtx) {
      stopAudio();
      startAudio();
    }
  }

  function createAudioChain() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = parseFloat(volInput.value) * 0.12;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.85;

    filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    filter.Q.value = 2;

    filterLFO = audioCtx.createOscillator();
    filterLFO.type = 'sine';
    filterLFO.frequency.value = 0.07;
    const filterLFODepth = audioCtx.createGain();
    filterLFODepth.gain.value = 400;
    filterLFO.connect(filterLFODepth).connect(filter.frequency);
    filterLFO.start();

    const track = tracks[currentTrack];

    osc1 = audioCtx.createOscillator();
    osc1.type = track.type;
    osc1.frequency.value = track.baseFreq;
    osc1.detune.value = track.detune;

    osc2 = audioCtx.createOscillator();
    osc2.type = track.type;
    osc2.frequency.value = track.baseFreq * 1.003;
    osc2.detune.value = track.detune + 6;

    subOsc = audioCtx.createOscillator();
    subOsc.type = 'sine';
    subOsc.frequency.value = track.baseFreq * 0.5;

    lfo1 = audioCtx.createOscillator();
    lfo1.type = 'sine';
    lfo1.frequency.value = track.lfoRate;
    const lfo1Depth = audioCtx.createGain();
    lfo1Depth.gain.value = track.lfoDepth;
    lfo1.connect(lfo1Depth);
    lfo1Depth.connect(osc1.frequency);
    lfo1Depth.connect(osc2.frequency);
    lfo1.start();

    lfo2 = audioCtx.createOscillator();
    lfo2.type = 'triangle';
    lfo2.frequency.value = track.lfoRate * 0.7;
    const lfo2Depth = audioCtx.createGain();
    lfo2Depth.gain.value = 200;
    lfo2.connect(lfo2Depth).connect(filter.frequency);
    lfo2.start();

    const osc1Gain = audioCtx.createGain();
    const osc2Gain = audioCtx.createGain();
    const subGain = audioCtx.createGain();
    osc1Gain.gain.value = 0.35;
    osc2Gain.gain.value = 0.25;
    subGain.gain.value = 0.15;

    osc1.connect(osc1Gain);
    osc2.connect(osc2Gain);
    subOsc.connect(subGain);

    osc1Gain.connect(filter);
    osc2Gain.connect(filter);
    subGain.connect(filter);

    filter.connect(analyser);
    analyser.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    osc1.start();
    osc2.start();
    subOsc.start();
  }

  function startAudio() {
    try {
      createAudioChain();
      isPlaying = true;
      playBtn.textContent = '‖';
      playBtn.setAttribute('aria-label', 'Pause music');
      playBtn.title = 'Pause';
      statusDot.classList.add('playing');
      try { localStorage.setItem(STORAGE_PREFIX + 'playing', 'true'); } catch(e){}
      drawVisualizer();
    } catch(e) {
      console.warn("Audio Context init error:", e);
    }
  }

  function stopAudio() {
    [osc1, osc2, subOsc, lfo1, lfo2, filterLFO].forEach(o => {
      if (o) {
        try { o.stop(); o.disconnect(); } catch(e){}
      }
    });
    if (filter) { try { filter.disconnect(); } catch(e){} }
    if (analyser) { try { analyser.disconnect(); } catch(e){} }
    if (masterGain) { try { masterGain.disconnect(); } catch(e){} }
    osc1 = osc2 = subOsc = lfo1 = lfo2 = filterLFO = filter = analyser = masterGain = null;
    isPlaying = false;
    playBtn.textContent = '▶';
    playBtn.setAttribute('aria-label', 'Play music');
    playBtn.title = 'Play (Off by default)';
    statusDot.classList.remove('playing');
    try { localStorage.setItem(STORAGE_PREFIX + 'playing', 'false'); } catch(e){}
    if (animationId) cancelAnimationFrame(animationId);
    clearCanvas();
  }

  function drawVisualizer() {
    if (!analyser || !isPlaying) return;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    const w = canvas.width, h = canvas.height;

    function draw() {
      if (!isPlaying) return;
      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, w, h);
      const barWidth = w / bufferLength * 1.5;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 255;
        const barH = v * h * 0.9;
        const hue = 180 + v * 60;
        ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${0.4 + v * 0.6})`;
        ctx.fillRect(x, h - barH, barWidth, barH);
        x += barWidth + 1;
      }
      animationId = requestAnimationFrame(draw);
    }
    draw();
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(0,229,255,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) stopAudio();
    else startAudio();
  });

  prevBtn.addEventListener('click', () => {
    currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
    updateTrack();
  });

  nextBtn.addEventListener('click', () => {
    currentTrack = (currentTrack + 1) % tracks.length;
    updateTrack();
  });

  volInput.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    try { localStorage.setItem(STORAGE_PREFIX + 'vol', val); } catch(e){}
    if (masterGain && audioCtx) {
      masterGain.gain.setValueAtTime(val * 0.12, audioCtx.currentTime);
    }
  });

  // If autoplay was persisted across page transitions, start audio on first user interaction or context resume
  if (autoPlay) {
    const resumeOnInteract = () => {
      startAudio();
      window.removeEventListener('pointerdown', resumeOnInteract);
      window.removeEventListener('keydown', resumeOnInteract);
    };
    window.addEventListener('pointerdown', resumeOnInteract);
    window.addEventListener('keydown', resumeOnInteract);
  }

  clearCanvas();
})();
</script>
