<nav class="site-nav" aria-label="Main navigation">
  <a href="{{ include.home | default: '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
  <a href="{{ '/repositories/' | relative_url }}" class="nav-link">Repositories</a>
  <a href="{{ '/media/' | relative_url }}" class="nav-link">Media</a>
  <a href="{{ '/dashboard/' | relative_url }}" class="nav-link">Dashboard</a>

  {# Dynamic LOGIN slot — populated by auth-bar.js on auth state change #}
  <span class="nav-login-slot" aria-live="polite">
    {# Signed-out state: shown by default; hidden once auth-bar.js sets session #}
    <a href="#" class="nav-link nav-login-out" data-mode="out" id="nav-login-link">
      Login
    </a>
    {# Signed-in state: hidden until auth-bar.js reveals it + fills in user info #}
    <span class="nav-login-in hidden" data-mode="in">
      <button class="nav-link nav-login-in-btn" id="nav-login-in-btn" aria-haspopup="true" aria-expanded="false">
        <img class="nav-login-avatar" data-bind="avatar" src="" alt="" width="20" height="20" style="border-radius:50%" loading="lazy">
        <span data-bind="login"></span>
        <span class="nav-login-role" data-bind="role"></span>
      </button>
    </span>
  </span>

  <a href="https://github.com/sponsors/{{ site.github_username | default: 'neohiro' }}" class="nav-link nav-sponsor" target="_blank" rel="noopener">♥ Sponsor</a>
</nav>

<script>
  /* Nav login slot wiring — wires the static nav Login link to the
   * bottom dock's Login panel. When auth-bar.js sets session, it also
   * updates the nav slot text via syncNavLoginSlot(). */
  (function () {
    var navLoginLink = document.getElementById('nav-login-link');
    var navLoginInBtn = document.getElementById('nav-login-in-btn');

    if (navLoginLink) {
      navLoginLink.addEventListener('click', function (e) {
        e.preventDefault();
        if (window.AuthBar) window.AuthBar.selectTab('login');
      });
    }

    /* Inlined here so nav.html is self-contained. auth-bar.js handles the
     * actual sync — we just wire the button to open the dock panel. */
    if (navLoginInBtn) {
      navLoginInBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (window.AuthBar) window.AuthBar.selectTab('user');
      });
    }
  })();
</script>
