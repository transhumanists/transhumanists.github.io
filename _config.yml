title: transhumanists
description: "Human Progress Dashboard — tracking breakthroughs in biotech, AGI, quantum, energy, cyber, space & defense"
url: "https://transhumanists.github.io"
baseurl: ""
github_username: transhumanists
github_repo: transhumanists.github.io

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge



exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - LICENSE
  - scripts
  - test
  - "*.ps1"
  - "*.sh"
  - scrapers/
  - llm/
  - self_healer/
  - social/
  - github/
  - webhooks/
  - requirements.txt
