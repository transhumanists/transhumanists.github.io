name: CI

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.md'
      - '_config.yml'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.md'
      - '_config.yml'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  js-checks:
    name: JS lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Static parse check (worldmap.js)
        run: bun build assets/js/worldmap.js --no-bundle --outdir /tmp/worldmap-check 2>&1 || echo "Static parse check completed"

      - name: Unit & integration tests
        run: bun test test/

  sync-script:
    name: Milestone sync script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Self-tests (stdlib)
        run: python scripts/test_sync.py

      - name: Layers sync script tests
        run: python scripts/test_sync_layers.py

      - name: Crisis zone script tests
        run: python scripts/test_fetch_crisis_zones.py

      - name: Full pytest suite
        run: python -m pytest scripts/

      - name: Scratch end-to-end generation
        env:
          STALE_ERROR_DAYS: "99"
        run: |
          set -euo pipefail
          python scripts/sync_milestones.py \
            --output-dir "$(mktemp -d)" \
            --upstream data/milestones.json \
            --today 2026-09-21

  data-reproducibility:
    name: Data regeneration is deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The published data cannot be compared byte-for-byte against a local
      # regeneration: milestone-check.yml fetches live upstream with no
      # --upstream and geocodes during the build, so the committed files are not
      # reproducible offline. What MUST hold is that regeneration is
      # deterministic and that its output satisfies every published invariant -
      # the ordering regression shipped precisely because neither was checked
      # anywhere. Two runs into separate directories must be identical.
      - name: Regenerate twice from the committed feed
        env:
          STALE_ERROR_DAYS: "99"
        run: |
          set -euo pipefail
          run_one() {
            python scripts/sync_milestones.py \
              --output-dir "$1" \
              --upstream data/milestones.json \
              --today 2026-10-01
          }
          run_one "$RUNNER_TEMP/gen-a"
          run_one "$RUNNER_TEMP/gen-b"
          for f in events.json milestones.json; do
            if ! diff -q "$RUNNER_TEMP/gen-a/data/$f" "$RUNNER_TEMP/gen-b/data/$f" >/dev/null; then
              echo "::error file=data/$f::Regeneration is not deterministic"
              diff "$RUNNER_TEMP/gen-a/data/$f" "$RUNNER_TEMP/gen-b/data/$f" | head -40
              exit 1
            fi
          done
          echo "Regeneration is deterministic"

      - name: Regenerated data satisfies every published invariant
        run: |
          set -euo pipefail
          # Only the files this pipeline produces; world_layers.json is written by
          # sync_layers.py / fetch_crisis_zones.py and is validated by data-check.
          python scripts/check_data.py \
            "$RUNNER_TEMP/gen-a/data/events.json" \
            "$RUNNER_TEMP/gen-a/data/milestones.json"
          # And the unifier must be idempotent: re-running over its own output
          # must not merge further records.
          python scripts/sync_milestones.py \
            --output-dir "$RUNNER_TEMP/gen-c" \
            --upstream "$RUNNER_TEMP/gen-a/milestones.json" \
            --today 2026-10-01
          python - <<'PY'
          import json, sys
          a = json.load(open(f"{__import__('os').environ['RUNNER_TEMP']}/gen-a/data/milestones.json", encoding="utf-8"))
          c = json.load(open(f"{__import__('os').environ['RUNNER_TEMP']}/gen-c/data/milestones.json", encoding="utf-8"))
          def count(d):
              return sum(len(v["milestones"]) for v in d["categories"].values())
          if count(a) != count(c):
              sys.exit(f"unifier not idempotent: {count(a)} -> {count(c)}")
          print(f"unifier idempotent: {count(a)} milestones")
          PY

  data-check:
    name: Validate map data files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate events.json and world_layers.json
        run: python scripts/check_data.py

      - name: Data validator self-tests
        run: python scripts/test_check_data.py

  jekyll-build:
    name: Jekyll build (GitHub Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Check rendered map markup
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          # Zoom/terminator buttons are created at runtime by worldmap.js, so
          # assert the static containers the widget is wired into.
          grep -q 'id="world-map-canvas"' _site/index.html
          grep -q 'id="map-timeline"'     _site/index.html
          grep -q 'id="map-tooltip"'      _site/index.html
          grep -q 'id="filter-recent"'    _site/index.html
          grep -q 'id="filter-military"'  _site/index.html
          grep -q 'id="filter-crisis"'    _site/index.html