name: CI

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.md'
      - '_config.yml'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.md'
      - '_config.yml'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  js-checks:
    name: JS lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Static parse check (worldmap.js)
        run: bun build assets/js/worldmap.js --no-bundle --outdir /tmp/worldmap-check

      - name: Unit & integration tests
        run: bun test test/

  sync-script:
    name: Milestone sync script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Self-tests (stdlib)
        run: python scripts/test_sync.py

      - name: Layers sync script tests
        run: python scripts/test_sync_layers.py

      - name: Scratch end-to-end generation
        env:
          STALE_ERROR_DAYS: "99"
        run: |
          set -euo pipefail
          python scripts/sync_milestones.py \
            --output-dir "$(mktemp -d)" \
            --upstream data/milestones.json \
            --today 2026-09-21

  data-check:
    name: Validate map data files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate events.json and world_layers.json
        run: python scripts/check_data.py

      - name: Data validator self-tests
        run: python scripts/test_check_data.py

  jekyll-build:
    name: Jekyll build (GitHub Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Check rendered map markup
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          grep -q 'id="zoom-in"'       _site/index.html
          grep -q 'id="zoom-out"'      _site/index.html
          grep -q 'id="reset-view"'    _site/index.html
          grep -q 'id="terminator-toggle"' _site/index.html
          grep -q 'id="map-tooltip"'   _site/index.html