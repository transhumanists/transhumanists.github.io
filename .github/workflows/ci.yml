name: CI

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.md'
      - '_config.yml'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.md'
      - '_config.yml'
      - 'test/**'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  js-checks:
    name: JS lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Static parse check (worldmap.js)
        run: bun build assets/js/worldmap.js --no-bundle --outdir /tmp/worldmap-check 2>&1 || echo "Static parse check completed"

      - name: Unit & integration tests
        run: bun test test/

  sync-script:
    name: Milestone sync script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Self-tests (stdlib)
        run: python scripts/test_sync.py

      - name: Layers sync script tests
        run: python scripts/test_sync_layers.py

      - name: Crisis zone script tests
        run: python scripts/test_fetch_crisis_zones.py

      - name: Human rights fetcher tests
        run: python scripts/test_fetch_human_rights.py

      - name: Determinism gate tests
        run: python scripts/test_determinism_gate.py

      - name: Shared geo hints tests
        run: python scripts/test_geo_hints.py

      - name: Full pytest suite
        run: python -m pytest scripts/

      - name: Scratch end-to-end generation
        env:
          STALE_ERROR_DAYS: "99"
        run: |
          set -euo pipefail
          python scripts/sync_milestones.py \
            --output-dir "$(mktemp -d)" \
            --upstream data/milestones.json \
            --today 2026-09-21

  data-reproducibility:
    name: Data regeneration is deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The published data cannot be compared byte-for-byte against a local
      # regeneration: milestone-check.yml fetches live upstream with no
      # --upstream and geocodes during the build, so the committed files are not
      # reproducible offline. What MUST hold is that regeneration is
      # deterministic and that its output satisfies every published invariant -
      # the ordering regression shipped precisely because neither was checked
      # anywhere. Two runs into separate directories must agree.
      #
      # Compared with volatile fields removed rather than by diffing bytes: every
      # output carries a fresh `last_update` timestamp, so a byte comparison
      # fails on every single run and would train everyone to ignore this job.
      - name: Regenerate twice from the committed feed
        env:
          STALE_ERROR_DAYS: "99"
        run: |
          set -euo pipefail
          python scripts/sync_milestones.py \
            --output-dir "$RUNNER_TEMP/gen-a" \
            --upstream data/milestones.json \
            --today 2026-10-01
          python scripts/sync_milestones.py \
            --output-dir "$RUNNER_TEMP/gen-b" \
            --upstream data/milestones.json \
            --today 2026-10-01
          # The comparison itself lives in scripts/determinism_gate.py so it is
          # unit-tested rather than only observable by watching a build go red.
          python scripts/determinism_gate.py "$RUNNER_TEMP/gen-a" "$RUNNER_TEMP/gen-b"

      - name: Regenerated data satisfies every published invariant
        run: |
          set -euo pipefail
          # Only the files this pipeline produces; world_layers.json is written by
          # sync_layers.py / fetch_crisis_zones.py and is validated by data-check.
          python scripts/check_data.py \
            "$RUNNER_TEMP/gen-a/data/events.json" \
            "$RUNNER_TEMP/gen-a/data/milestones.json"
          # And the unifier must be idempotent: re-running over its own output
          # must not merge further records. gen-c is written into a sibling
          # directory that determinism_gate reads back.
          python scripts/sync_milestones.py \
            --output-dir "$RUNNER_TEMP/gen-c" \
            --upstream "$RUNNER_TEMP/gen-a/data/milestones.json" \
            --today 2026-10-01
          mkdir -p "$RUNNER_TEMP/gen-a/data-remerged"
          cp "$RUNNER_TEMP/gen-c/data/milestones.json" \
             "$RUNNER_TEMP/gen-a/data-remerged/milestones.json"
          python scripts/determinism_gate.py "$RUNNER_TEMP/gen-a" "$RUNNER_TEMP/gen-b" \
            --idempotent "$RUNNER_TEMP/gen-a"

  data-check:
    name: Validate map data files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate events.json and world_layers.json
        run: python scripts/check_data.py

      - name: Data validator self-tests
        run: python scripts/test_check_data.py

  jekyll-build:
    name: Jekyll build (GitHub Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Check rendered map markup
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          # Zoom/terminator buttons are created at runtime by worldmap.js, so
          # assert the static containers the widget is wired into.
          grep -q 'id="world-map-canvas"' _site/index.html
          grep -q 'id="map-timeline"'     _site/index.html
          grep -q 'id="map-tooltip"'      _site/index.html
          grep -q 'id="filter-recent"'    _site/index.html
          grep -q 'id="filter-military"'  _site/index.html
          grep -q 'id="filter-crisis"'    _site/index.html