name: Milestone Check & Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate but skip commits"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/milestone-check.yml"
      - "scripts/sync_milestones.py"
      - "scripts/sync_layers.py"

permissions:
  contents: write

concurrency:
  group: "milestone-check"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache milestone data
        uses: actions/cache@v4
        with:
          path: |
            data/milestones.json
            data/milestones_history.json
            data/activity.json
            data/events.json
            data/world_layers.json
          key: milestone-data-${{ hashFiles('data/*.json') }}
          restore-keys: |
            milestone-data-

      - name: Run milestone sync
        env:
          DRY_RUN: ${{ inputs.dry_run == 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/sync_milestones.py --dry-run
          else
            python scripts/sync_milestones.py
          fi

      - name: Sync operational layers (conflicts + deployments)
        env:
          DRY_RUN: ${{ inputs.dry_run == 'true' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/sync_layers.py
          else
            python scripts/sync_layers.py --write
          fi

      - name: Commit and push changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ scripts/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore(milestone-check): refresh milestone & layer data ${ts}"
          git push origin main