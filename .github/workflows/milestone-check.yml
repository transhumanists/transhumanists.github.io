name: Milestone Check & Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate but skip commits"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/milestone-check.yml"
      - "scripts/sync_milestones.py"
      - "scripts/sync_layers.py"
      - "scripts/scrape_historical_milestones.py"
      - "data/historical_milestones.json"

permissions:
  contents: write

concurrency:
  # Both world_layers.json writers share this group so a crisis-zone refresh
  # and a layer sync never run concurrently; queued (not cancelled) runs are
  # allowed so an in-flight auto-commit is never interrupted.
  group: "map-data-writers"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run milestone sync
        env:
          DRY_RUN: ${{ inputs.dry_run == 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/sync_milestones.py --dry-run
          else
            OUT=$(python scripts/sync_milestones.py 2>&1)
            echo "$OUT"
            if echo "$OUT" | grep -q "No content changes"; then
              echo "No new upstream milestones - backfilling historical archive"
              python scripts/scrape_historical_milestones.py --limit "${HISTORICAL_BACKFILL_LIMIT:-5}"
              python scripts/sync_milestones.py
            fi
          fi

      - name: Sync operational layers (conflicts + deployments)
        env:
          DRY_RUN: ${{ inputs.dry_run == 'true' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/sync_layers.py
          else
            python scripts/sync_layers.py --write
          fi

      - name: Report milestone coverage
        # The cron only ever reports what changed. This reports what is missing -
        # empty years on the slider, verticals with nothing in them, unlocated
        # records - so the backlog is visible in the run log without a local setup.
        # --snapshot also appends to data/coverage_history.json, but only when the
        # findings actually changed, so the committed file is a changelog of progress
        # toward filling the gaps rather than a timestamp every six hours.
        run: python scripts/coverage_report.py --snapshot

      - name: Reject null-island geocoding
        # (0,0) is upstream's "unknown location" sentinel. Storing it plots a dot
        # in the Gulf of Guinea, and check_events has always rejected it while
        # check_milestones used to accept it - so it reached main from a green run.
        run: python scripts/coverage_report.py --fail-on-null-island --quiet

      - name: Publish invariants
        # Before the commit, alongside validate data files: a refresh that breaks a
        # cross-file invariant must fail the job and never reach main.
        run: python scripts/publish_invariants.py

      - name: Validate data files
        # Gate BEFORE the commit: a malformed sync must fail the job and never
        # reach main (the CI job only reports afterwards).
        run: python scripts/check_data.py

      - name: Commit and push changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ scripts/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          ts=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          git commit -m "chore(milestone-check): refresh milestone & layer data ${ts}"
          # The remote can advance while this job runs (a scheduled run collides
          # with a manual push). Rebase onto the latest main, then retry once;
          # fail loudly rather than silently dropping a data refresh.
          if git push origin main; then
            echo "Pushed data refresh to main"
          else
            echo "Push rejected (remote moved?) - rebasing and retrying..."
            git pull --rebase origin main
            git push origin main
            echo "Pushed data refresh to main (after rebase)"
          fi