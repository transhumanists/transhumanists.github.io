<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"
     aria-labelledby="wm-title wm-desc" preserveAspectRatio="xMidYMid meet">
  <title id="wm-title">Human progress map</title>
  <desc id="wm-desc">A world map with plotted markers for milestones, conflict zones and ground deployments. Links to the live interactive map.</desc>

  <defs>
    <radialGradient id="wm-glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#132039"/>
      <stop offset="100%" stop-color="#070c16"/>
    </radialGradient>
    <!-- A coarse graticule rather than real coastlines. This is a card that
         links to the real map; pretending to be cartography here would make a
         decorative element look like data. -->
    <pattern id="wm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d2c47" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="320" fill="url(#wm-glow)"/>
  <rect width="640" height="320" fill="url(#wm-grid)" opacity="0.55"/>

  <g fill="none" stroke="#24344f" stroke-width="1.2">
    <path d="M78 96c26-18 54-22 78-12s30 36 52 40 44-6 62-22 40-16 58 2 26 42 4 58-52 14-74 30-40 40-64 42-44-16-62-18-44 6-62-2-30-32-46-48 24-50 54-70z"/>
    <path d="M356 214c22-10 46-8 62 6s22 34 4 44-46 10-64-2-22-38-2-48z"/>
  </g>

  <!-- Milestone markers: the accent hue, sized so a few read as points
       rather than as a scatter. -->
  <g fill="#7de2d1">
    <circle cx="150" cy="118" r="5"/>
    <circle cx="196" cy="146" r="3.5"/>
    <circle cx="262" cy="104" r="4"/>
    <circle cx="300" cy="168" r="3"/>
    <circle cx="384" cy="128" r="4.5"/>
    <circle cx="428" cy="164" r="3"/>
    <circle cx="452" cy="112" r="3.5"/>
    <circle cx="236" cy="196" r="3"/>
  </g>

  <!-- Conflict zones: rings, matching the area semantics the live map gives
       them. -->
  <g fill="none" stroke="#ff6d8a" stroke-width="1.6" opacity="0.9">
    <circle cx="404" cy="118" r="13"/>
    <circle cx="404" cy="118" r="5" fill="#ff6d8a" stroke="none"/>
    <circle cx="196" cy="146" r="9" opacity="0.75"/>
  </g>

  <!-- Deployments: chevrons. -->
  <g fill="#ffb347" opacity="0.9">
    <path d="M330 150l10 6-10 6z"/>
    <path d="M356 168l10 6-10 6z"/>
    <path d="M288 186l10 6-10 6z"/>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="20" y="34" fill="#8fa3c0" font-size="15" letter-spacing="0.5">HUMAN PROGRESS</text>
    <text x="20" y="298" fill="#5f7391" font-size="12">conflict zones · deployments · milestones</text>
  </g>
</svg>