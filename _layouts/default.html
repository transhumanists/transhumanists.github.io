<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="transhumanists - Home">
          <span class="logo-mark" aria-hidden="true">🚀</span>
          <span class="logo-text">transhumanists</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#milestones" class="nav-link">Milestones</a>
          <a href="#world-map" class="nav-link">World Map</a>
          <a href="{{ '/milestones/' | relative_url }}" class="nav-link">All Metrics</a>
          <a href="https://github.com/transhumanists" class="nav-link nav-sponsor" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="site-main" role="main">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <p class="footer-tagline">Tracking human progress. One milestone at a time.</p>
        <p class="footer-links">
          <a href="https://github.com/transhumanists" target="_blank" rel="noopener">GitHub</a>
          <span aria-hidden="true">·</span>
          <a href="https://facebook.com/transhumanistsBE" target="_blank" rel="noopener">Facebook</a>
          <span aria-hidden="true">·</span>
          <a href="https://frenzypenguin-media.github.io" target="_blank" rel="noopener">FrenzyPenguin Media</a>
        </p>
        <div class="sponsor-links">
          <a href="https://neohiro.github.io/" target="_blank" rel="noopener">🌐 neohiro.github.io</a>
          <a href="https://github.com/sponsors/neohiro" class="sponsor-red" target="_blank" rel="noopener">♥ Sponsor neohiro</a>
        </div>
        <p class="footer-brand">A <a href="https://frenzypenguin-media.github.io" target="_blank" rel="noopener">FrenzyPenguin Media</a> project</p>
      </div>
    </footer>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script>
    window.TRANSGUMANISTS_CONFIG = {
      milestonesRepo: 'transhumanists/milestones',
      apisRepo: 'transhumanists/apis',
      githubToken: '',
      refreshInterval: 300000
    };
  </script>
</body>
</html>
