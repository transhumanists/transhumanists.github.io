<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/network-ux.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/auth-bar.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://mainframe.taild879f3.ts.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="page-wrapper">
    <header class="site-header" role="banner">
      <div class="container">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="transhumanists - Home">
          <span class="logo-mark" aria-hidden="true">ðŸ§¬</span>
          <span class="logo-text">transhumanists</span>
        </a>
      </div>
    </header>

    <main id="main" class="site-main" role="main" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <p style="text-align:center;color:var(--fg-muted);font-size:0.85rem;">&copy; {{ site.time | date: '%Y' }} transhumanists â€” Human Progress Dashboard</p>
      </div>
        {% include heartbeat-status.html %}

    </footer>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/network-ux.js' | relative_url }}"></script>
</body>
</html>
